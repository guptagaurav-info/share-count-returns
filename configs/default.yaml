# Fixed before the tests were run.
start: "2002-01-31"          # first month with 12 months of lagged share counts for most of the universe
universe_size: 1000          # largest US operating companies by trailing 12-month dollar volume
report_lag_months: 3         # a share count dated month m is used from month m+3 (filing lag)
quintiles: 5
cost_bps_per_side: 10
split_year: 2014             # first and second halves: 2002-2013 vs 2014-2026
hypotheses:
  H1: "Companies that shrank their share count most (top fifth) beat the heaviest issuers (bottom fifth) after costs."
  H2: "The gap survives market beta (CAPM alpha) and holds within sectors."
  H3: "The gap is smaller in 2014-2026 than in 2002-2013."
  H4: "Most of the gap comes from issuers lagging, not from buyback companies leading."
sources:
